name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  branch-name:
    name: branch name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: the head branch names the issue it serves
        run: |
          b="${{ github.head_ref }}"
          echo "$b" | grep -Eq '^[0-9]+-[a-z0-9-]+$' && echo "ok: $b" || { echo "branch '$b' must be <issue>-<short-title>, e.g. 4-storage-plugin"; exit 1; }

  test:
    name: lint, build, test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: the example checks and rehearses
        run: |
          npx wilanis check example
          npx wilanis check libraries/access
          npx wilanis rehearse example
        env:
          MONITOR_JWT_SECRET: ci-only-not-a-secret
