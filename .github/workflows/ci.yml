name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint, build, test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: the example checks and rehearses
        run: |
          npx wilanis check example
          npx wilanis check libraries/access
          npx wilanis rehearse example
        env:
          MONITOR_JWT_SECRET: ci-only-not-a-secret
